<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Asistencia</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <main class="scene">
        <div class="card-container" id="weddingCard">

            <!-- TAPA QUE SE ABRE HACIA ARRIBA -->
            <div class="card-flap">
                
                <!-- PORTADA: SOLO EL LOGO GRANDE Y CENTRADO -->
                <div class="flap-face flap-front">
                    <img src="logo.png" alt="Logo" class="logo-cover">
                </div>

                <!-- INTERIOR SUPERIOR: TEXTO QUE ME DIGAS -->
                <div class="flap-face flap-back">
                    <div class="inside-top-content">
                        <!-- Aquí pondremos el texto que me digas -->
                        <h2 class="quote-title">¡Nos Casamos!</h2>
                        <p class="quote-text">
                            Aquí irá el texto que tú me digas.<br>
                            Lo he dejado preparado con tipografía elegante para cuando lo tengamos.
                        </p>
                    </div>
                </div>

            </div>

            <!-- INTERIOR INFERIOR: BASE CON EL ENLACE AL FORMS -->
            <div class="card-base">
                <div class="inside-bottom-content">
                    <h3 class="forms-title">CONFIRMACIÓN</h3>
                    <p class="forms-sub">Por favor, confirma tu asistencia en el siguiente formulario:</p>
                    
                    <!-- ENLACE A GOOGLE FORMS -->
                    <a href="https://forms.google.com" target="_blank" rel="noopener noreferrer" class="btn-forms" id="formsBtn">
                        CONFIRMAR ASISTENCIA
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- SCRIPT DIRECTO DENTRO DEL HTML (SIN NECESIDAD DE OTRO ARCHIVO) -->
    <script>
        const card = document.getElementById('weddingCard');
        const formsBtn = document.getElementById('formsBtn');

        // Abre y cierra la tarjeta al tocarla
        card.addEventListener('click', () => {
            card.classList.toggle('open');
        });

        // Evita que pulsar el botón cierre la tarjeta en vez de abrir el link
        formsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
</body>
</html>
